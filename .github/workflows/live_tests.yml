name: Live Model Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ovos_hierarchical_knn_pipeline/**'
      - 'tests/test_live_fixture.py'
      - 'tests/fixtures/**'
      - '.github/workflows/live_tests.yml'
  workflow_dispatch:

jobs:
  live_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev swig libssl-dev
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e .
          uv pip install --system pytest pytest-timeout ovoscope
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-hknn-granite-v1
      - name: Run live fixture test
        env:
          OVOSCOPE_LIVE: "1"
        run: |
          pytest tests/test_live_fixture.py -v --timeout=900
